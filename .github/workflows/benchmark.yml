name: Workshop benchmark

on:
  workflow_dispatch:
    inputs:
      split:
        description: Evaluation set (tune on dev before using hidden)
        type: choice
        options: [dev, hidden]
        default: dev
  push:
    branches: [workshop-solution]
    paths: ['rag/**', 'scripts/**', 'tests/**', '.github/workflows/benchmark.yml']

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pipeline: [baseline, improved]
    env:
      PYTHONUNBUFFERED: '1'
      LLM_PROVIDER: ollama
      OLLAMA_MODEL: llama3.2:3b
      OLLAMA_HOST: http://localhost:11434
      LLM_TIMEOUT_SECONDS: '300'
      SPLIT: ${{ inputs.split || 'dev' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: |
          python -m pip install uv
          uv sync
      - name: Run unit tests and confirm the scorer is unchanged
        run: |
          uv run python -m unittest discover -s tests -v
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              'eval/harness.py': '6bda6d2c3421a75c834d93d3d6eabe1de79283196b2164b79229f0ab0aba23c3',
              'eval/metrics.py': 'b685f91e04bbb61577bec65bbcc4fe622a341e74b59508e309a11a71a29d80eb',
          }
          for name, digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          PY
      - name: Prepare original deterministic dataset
        run: uv run python scripts/prepare_data.py
      - name: Install and start Ollama
        run: |
          curl --fail --silent --show-error --location https://ollama.com/install.sh -o "$RUNNER_TEMP/install-ollama.sh"
          OLLAMA_VERSION=0.34.3 sh "$RUNNER_TEMP/install-ollama.sh"
          if ! curl --fail --silent http://localhost:11434/api/tags; then
            ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          fi
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:11434/api/tags; then break; fi
            sleep 2
          done
          ollama pull "$OLLAMA_MODEL"
          ollama --version
          ollama list
      - name: Measure retrieval and model answers
        run: |
          uv run python scripts/benchmark.py --split retrieval --pipeline "${{ matrix.pipeline }}"
          uv run python scripts/benchmark.py --split "$SPLIT" --pipeline "${{ matrix.pipeline }}"
      - name: Save measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.SPLIT }}-${{ matrix.pipeline }}
          path: results/*.json
          if-no-files-found: warn
